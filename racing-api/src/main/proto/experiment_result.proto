syntax = "proto3";

option java_multiple_files = true;
package world.willfrog.racing.idl;

import "common.proto";

// 结果查询使用开发者授权和原实例编号。它回答实际使用和调用，不代替分配历史，也不返回完整模型输入。
message QueryExperimentResultRequest {
  string environment = 1;
  string scope_instance_id = 2;
  // 空字符串表示不按实验编号筛选。
  string experiment_id = 3;
  // 未设置表示不按配置版本筛选。设置时必须大于 0。
  optional int64 configuration_version = 4;
  // 空字符串表示不按实际采用值筛选。
  string adopted_value_json = 5;
  int32 offset = 6;
  // 0 表示默认 50 条，最大 200 条。
  int32 limit = 7;
}

message ExperimentResultRow {
  // 已结束且没有原分配时留空。
  string assignment_id = 1;
  string environment = 2;
  string scope_instance_id = 3;
  string experiment_id = 4;
  string owner_namespace = 5;
  string owner_kind = 6;
  string owner_scope_instance_id = 7;
  string root_id = 8;
  string source_kind = 9;
  optional int64 configuration_version = 10;
  string adopted_value_json = 11;
  string root_run_id = 12;
  string call_id = 13;
  string recorded_at = 14;
  // 业务未提供时留空。
  string content_checksum = 15;
  // 业务未提供时留空。
  string result_json = 16;
  string usage_id = 17;
  string current_run_id = 18;
  // ONLINE、OFFLINE，或空字符串表示读不到已发布版本。
  string run_mode = 19;
}

// 顺序为 recorded_at、call_id。
message ExperimentResultPage {
  repeated ExperimentResultRow rows = 1;
}

message QueryExperimentResultReply {
  oneof result {
    ExperimentResultPage page = 1;
    RacingError error = 2;
  }
}

// 环境和泳道实例供开发者授权。usage_id 定位一条实际使用。
message SupplementExperimentResultRequest {
  string environment = 1;
  string scope_instance_id = 2;
  string usage_id = 3;
  string result_json = 4;
}

message CorrectExperimentResultRequest {
  string environment = 1;
  string scope_instance_id = 2;
  string usage_id = 3;
  string result_json = 4;
}

message DeleteExperimentResultRequest {
  string environment = 1;
  string scope_instance_id = 2;
  string usage_id = 3;
}

message ExperimentResultAccepted {}

message SupplementExperimentResultReply {
  oneof result {
    ExperimentResultAccepted accepted = 1;
    RacingError error = 2;
  }
}

message CorrectExperimentResultReply {
  oneof result {
    ExperimentResultAccepted accepted = 1;
    RacingError error = 2;
  }
}

message DeleteExperimentResultReply {
  oneof result {
    ExperimentResultAccepted accepted = 1;
    RacingError error = 2;
  }
}

// 筛选与查询明细相同。run_mode 为空表示不按运行方式筛选。
message SummarizeExperimentResultRequest {
  string environment = 1;
  string scope_instance_id = 2;
  string experiment_id = 3;
  optional int64 configuration_version = 4;
  string adopted_value_json = 5;
  string run_mode = 6;
}

// assignment_count 是该实验和配置版本在获准范围内的分配行数，同一版本的各个采用值分组上重复出现。
// 使用数、缺失结果数和随机样本数按本组计算。随机样本数排除来源 ENDED_FIXED。
message ExperimentResultSummaryGroup {
  string experiment_id = 1;
  optional int64 configuration_version = 2;
  string adopted_value_json = 3;
  string run_mode = 4;
  int64 assignment_count = 5;
  int64 usage_count = 6;
  int64 missing_result_count = 7;
  int64 sample_count = 8;
}

message ExperimentResultSummary {
  repeated ExperimentResultSummaryGroup groups = 1;
}

message SummarizeExperimentResultReply {
  oneof result {
    ExperimentResultSummary summary = 1;
    RacingError error = 2;
  }
}
